<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Content-Security-Policy stricte : rien n'est autorisé par défaut.
  - script-src : uniquement le script en ligne ci-dessous (empreinte SHA-256) et three.js r128 sur cdnjs.
  - style-src  : uniquement la feuille de style en ligne (empreinte SHA-256) ; aucun attribut style="".
  ATTENTION : toute modification de la feuille de style ou du script en ligne change son empreinte.
  Il faut alors recalculer le SHA-256 (base64) du contenu du bloc, avec des fins de ligne LF,
  et remplacer la valeur correspondante ci-dessous, sinon le navigateur bloquera le bloc.
-->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-hpDmCQvfjmtT7IrSo68HRFCfmlqBxfF6H9NuWeLJC1E=' https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js; style-src 'sha256-c/yqqvNeDJnDuYIEMnlnJPIgYhCUszp1Dnf2c7ro93c='; img-src 'self' data: blob:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Bosquet Royale 3D</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#9fd8ff;font-family:"Trebuchet MS","Segoe UI",Verdana,sans-serif;user-select:none;color:#2d2a4a}
  canvas{position:fixed;left:0;top:0;width:100vw;height:100vh;display:block}
  #hud{pointer-events:none;z-index:2}
  .ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:5;background:radial-gradient(ellipse at center,rgba(20,30,70,.25),rgba(20,30,70,.7))}
  .hidden{display:none}
  .card{background:#fffbea;border:5px solid #2d2a4a;border-radius:26px;padding:26px 36px;max-width:560px;width:calc(100% - 60px);max-height:calc(100% - 40px);overflow:auto;text-align:center;box-shadow:0 10px 0 #2d2a4a;animation:pop .35s cubic-bezier(.2,1.5,.5,1)}
  @keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes floaty{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
  @keyframes shine{0%{background-position:0% 50%}100%{background-position:200% 50%}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  h1{margin:0 0 4px;font-size:54px;letter-spacing:1px;line-height:1.05;background:linear-gradient(90deg,#ff7a1a,#ffd21f,#ff5470,#ff7a1a);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px #2d2a4a;animation:floaty 3.2s ease-in-out infinite,shine 4s linear infinite}
  h1 small{display:block;font-size:22px;letter-spacing:8px;-webkit-text-stroke:1px #2d2a4a}
  h2{margin:0 0 12px;font-size:34px}
  h2.win{color:#e6a700}
  h2.lose{color:#ff5470}
  p{font-size:16px;margin:8px 0 14px;font-weight:bold}
  .row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:9px 0;font-weight:bold;font-size:15px;text-align:left}
  .row input[type=range]{flex:0 0 190px}
  .row select,.row input[type=text]{font-family:inherit;font-size:15px;font-weight:bold;padding:6px 10px;border:3px solid #2d2a4a;border-radius:10px;background:#fff;color:#2d2a4a}
  #pseudo{width:230px;font-size:20px;text-align:center;padding:9px 12px;border:4px solid #2d2a4a;border-radius:14px;font-family:inherit;font-weight:bold;color:#2d2a4a;margin:6px 0 16px}
  button{font-family:inherit;font-weight:bold;color:#2d2a4a;border:4px solid #2d2a4a;border-radius:16px;cursor:pointer;box-shadow:0 5px 0 #2d2a4a;transition:transform .08s}
  button:hover{transform:translateY(-2px)}
  button:active{transform:translateY(3px);box-shadow:0 2px 0 #2d2a4a}
  .big{font-size:24px;background:#5fe36a;padding:10px 46px;animation:pulse 1.6s ease-in-out infinite}
  .mid{font-size:17px;background:#ffe14d;padding:8px 22px;margin:10px 5px 0}
  .keybtn{font-size:14px;background:#fff;padding:4px 12px;min-width:92px;border-width:3px;box-shadow:0 3px 0 #2d2a4a;border-radius:10px}
  .keybtn.wait{background:#ffb3c0}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:0 26px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
  .stat{background:#fff;border:3px solid #2d2a4a;border-radius:12px;padding:6px 8px}
  .stat b{display:block;font-size:20px}
  .stat span{font-size:12px;font-weight:bold;opacity:.75}
  .ok{color:#1c9c3c}
  .bad{color:#d6336c}
  .note{font-size:13px;opacity:.8;margin:6px 0 0}
  #best{font-size:14px;margin-top:14px}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="hud"></canvas>

<div id="menu" class="ov">
  <div class="card">
    <h1>BOSQUET ROYALE<small>3D</small></h1>
    <p>21 combattants, une tempête, un seul survivant.</p>
    <input id="pseudo" type="text" maxlength="16" placeholder="Ton pseudo" autocomplete="off" spellcheck="false">
    <div><button id="btnPlay" class="big">JOUER</button></div>
    <div><button id="btnSettings" class="mid">Réglages</button></div>
    <p id="best"></p>
  </div>
</div>

<div id="settings" class="ov hidden">
  <div class="card">
    <h2>Réglages</h2>
    <div class="row"><span>Sensibilité de la souris</span><input id="optSens" type="range" min="0.2" max="3" step="0.1"></div>
    <div class="row"><span>Volume</span><input id="optVol" type="range" min="0" max="1" step="0.05"></div>
    <div class="row"><span>Qualité graphique</span><select id="optQual"><option value="low">Basse</option><option value="medium">Moyenne</option><option value="high">Haute</option></select></div>
    <div class="row"><span>Rejouer le tutoriel à la prochaine partie</span><input id="optTuto" type="checkbox"></div>
    <p>Touches (clique puis appuie sur la nouvelle touche)</p>
    <div id="keys" class="cols"></div>
    <button id="btnResetKeys" class="mid">Touches par défaut</button>
    <button id="btnCloseSettings" class="mid">Retour</button>
  </div>
</div>

<div id="pause" class="ov hidden">
  <div class="card">
    <h2>Pause</h2>
    <div><button id="btnResume" class="big">REPRENDRE</button></div>
    <button id="btnPauseSettings" class="mid">Réglages</button>
    <button id="btnQuit" class="mid">Menu principal</button>
  </div>
</div>

<div id="end" class="ov hidden">
  <div class="card">
    <h2 id="endTitle"></h2>
    <p id="endText"></p>
    <div id="stats" class="stats"></div>
    <p id="integrity" class="note"></p>
    <button id="btnReplay" class="mid">Rejouer</button>
    <button id="btnMenu" class="mid">Menu principal</button>
  </div>
</div>

<div id="err" class="ov hidden"><div class="card"><h2>Oups</h2><p id="errText"></p></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" integrity="sha512-dLxUelApnYxpLt6K2iomGngnHO83iUvZytA3YjDUCjT0HDOHKXnVYdf3hU4JjM8uEhxf9nD1/ey98U3t2vZ0qQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
/* =====================================================================================
   BOSQUET ROYALE 3D — un seul fichier, organisé en modules :
     1. CONFIG      constantes de jeu (gelées)
     2. SÉCURITÉ    nettoyage du pseudo, validation des actions, intégrité du score
     3. RÉGLAGES    sensibilité, qualité, volume, touches (localStorage validé)
     4. AUDIO       petits sons synthétisés (WebAudio)
     5. PHYSIQUE    monde, grille spatiale, collisions, lignes de vue
     6. JEU         règles : combat, construction, objets, tempête
     7. IA          comportement des 20 adversaires
     8. RENDU       scène three.js : caméra 3e personne, ombres, lumières, brouillard
     9. INTERFACE   HUD, menus, tutoriel, entrées clavier/souris
    10. BOUCLE      boucle principale
   Tout le code vit dans une fonction fermée : aucune variable de jeu n'est accessible
   depuis la console. Aucun eval, aucun innerHTML : le texte passe par textContent/canvas.
   ===================================================================================== */
(() => {
'use strict';
const $ = id => document.getElementById(id);
if (typeof THREE === 'undefined') {
  $('menu').classList.add('hidden'); $('err').classList.remove('hidden');
  $('errText').textContent = 'Impossible de charger three.js depuis cdnjs. Vérifie ta connexion Internet puis recharge la page.';
  return;
}

/* ================================ 1. CONFIG ================================ */
const TAU = Math.PI * 2;
const W = 4200;            // taille du monde (unités logiques)
const K = 0.05;            // conversion unités logiques -> unités 3D
const CELL = 90;           // grille de construction
const G = 210, GN = Math.ceil(W / G); // grille spatiale des obstacles
const TOTAL = 21;          // joueurs par partie
const SPEED_PLAYER = 235, SPEED_BOT = 205;
const WALL_H = 3, RAMP_H = 2.4, HOUSE_H = 3.4, TRUNK_H = 4;
const WAIT = 40, CYCLE = 60; // tempête : 40 s d'attente puis 20 s de rétrécissement, toutes les 60 s
const RADII = Object.freeze([3000, 1900, 1250, 800, 480, 260, 110, 0]);
const STORM_DPS = Object.freeze([1, 1, 2, 3, 5, 8, 10, 12]);
const deepFreeze = o => { Object.values(o).forEach(v => { if (v && typeof v === 'object') deepFreeze(v); }); return Object.freeze(o); };
const WEAP = deepFreeze({
  pistol:  { name: 'Pistolet',       tier: 1, dmg: 17, rate: .28,  spread: .04,  speed: 1300, range: 650,  mag: 12, reload: 1.2, pellets: 1, len: 16, col: '#cfd8dc' },
  smg:     { name: 'Mitraillette',   tier: 2, dmg: 10, rate: .085, spread: .11,  speed: 1300, range: 560,  mag: 30, reload: 1.6, pellets: 1, len: 20, col: '#4fc3f7' },
  shotgun: { name: 'Pompe',          tier: 2, dmg: 9,  rate: .85,  spread: .2,   speed: 1200, range: 330,  mag: 5,  reload: 2.0, pellets: 7, len: 24, col: '#ff8a65' },
  rifle:   { name: "Fusil d'assaut", tier: 3, dmg: 21, rate: .15,  spread: .045, speed: 1500, range: 820,  mag: 25, reload: 1.8, pellets: 1, len: 28, col: '#ce93d8' },
  sniper:  { name: 'Sniper',         tier: 4, dmg: 85, rate: 1.3,  spread: .004, speed: 2400, range: 1500, mag: 3,  reload: 2.4, pellets: 1, len: 36, col: '#ffd54f' }
});
const MELEE_DMG = 20, MELEE_RATE = .42, BOT_DMG = .6;
const GUN_POOL = ['pistol','pistol','pistol','pistol','pistol','pistol','smg','smg','smg','smg','shotgun','shotgun','shotgun','shotgun','rifle','rifle','rifle','rifle','sniper','sniper'];
const BOT_NAMES = ['Biscotte','Pamplemousse','Capitaine Flan','Zigoto','Moustique','Cornichon','Tornade','Papillon','Chouquette','Gribouille','Ouragan','Pistache','Farfadet','Bigorneau','Saucisson','Mirabelle','Turbo','Clafoutis','Zébulon','Praline','Rocket','Nougat','Ciboulette','Bandit'];
const BOT_COLORS = ['#ff5470','#4dabf7','#b197fc','#ff922b','#20c997','#f783ac','#e03131','#15aabf','#845ef7','#fab005','#94d82d','#ff6b6b','#3bc9db','#da77f2'];
const QUALITY = deepFreeze({
  low:    { ratio: .7,  shadow: 0,    parts: 150, far: 170 },
  medium: { ratio: 1,   shadow: 1024, parts: 350, far: 260 },
  high:   { ratio: 2,   shadow: 2048, parts: 600, far: 340 }
});

const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, k) => a + (b - a) * k;
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }

/* État partagé de la partie (privé à cette fermeture). */
let ents = [], player = null, statics = [], grid = [], houses = [], trees = [], structures = [], structKeys = new Set();
let items = [], bullets = [], parts = [], texts = [], feed = [], storm = null, decor = [];
let state = 'menu', aliveCount = 0, gameTime = 0, mmCanvas = null;
const fx = { hitMarker: 0, hurt: 0, heal: 0, recoil: 0, shake: 0 };
const tuto = { active: false, step: 0, moved: 0, turned: 0, hitTree: false, built: false, gotGun: false, fired: false, doneT: 0 };

/* ================================ 2. SÉCURITÉ ================================
   Tout se passe côté client : ces contrôles détectent les incohérences (vitesse, cadence,
   dégâts, valeurs hors bornes) et les modifications simples du score enregistré. Sans
   serveur, ils ne peuvent pas arrêter quelqu'un qui réécrit le fichier lui-même. */
const Security = (() => {
  // Jeton aléatoire de session : il amorce la chaîne d'empreintes du score.
  const nonce = (() => { const a = new Uint32Array(2); try { crypto.getRandomValues(a); } catch (e) { a[0] = Math.random() * 4294967296; a[1] = Math.random() * 4294967296; } return a[0].toString(16) + a[1].toString(16); })();
  function h32(str, seed) { let h = seed >>> 0; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } h ^= h >>> 15; h = Math.imul(h, 0x2c1b3c6d); h ^= h >>> 12; return h >>> 0; }
  function hash(str) { return ('0000000' + h32(str, 2166136261).toString(16)).slice(-8) + ('0000000' + h32(str, 0x9747b28c).toString(16)).slice(-8); }

  /* Pseudo : on ne garde que lettres, chiffres, espace, tiret et souligné (16 caractères max).
     Les chevrons, guillemets et esperluettes disparaissent, donc aucune injection HTML possible ;
     par ailleurs le pseudo n'est jamais écrit avec innerHTML. */
  function sanitizeName(raw) {
    let s = String(raw == null ? '' : raw);
    try { s = s.normalize('NFKC'); } catch (e) {}
    s = s.replace(/[^\p{L}\p{N} _-]/gu, '').replace(/\s+/g, ' ').trim().slice(0, 16).trim();
    return s || 'Joueur';
  }

  let log = [], chain = '', flags = [], cfgSum = '';
  const cfgHash = () => hash(JSON.stringify(WEAP) + MELEE_DMG + '|' + SPEED_PLAYER + '|' + STORM_DPS.join());
  function reset() { log = []; chain = hash(nonce); flags = []; cfgSum = cfgHash(); }
  /* Journal du score : chaque événement est ajouté à une chaîne d'empreintes. */
  function record(type, val) { val = Math.round(val) || 0; log.push([type, val]); chain = hash(chain + '|' + type + '|' + val); }
  function flag(reason) { if (flags.length < 50) flags.push(reason); }

  /* Validation des actions (appliquée au joueur comme aux adversaires). */
  function checkTeleport(e) { // la position n'a pas le droit de changer entre deux pas de simulation
    if (Math.abs(e.x - e.px) > .01 || Math.abs(e.y - e.py) > .01) { e.x = e.px; e.y = e.py; flag('téléportation'); }
  }
  function checkMove(e, maxSpeed, dt) { // un pas ne peut pas dépasser la vitesse maximale
    const dx = e.x - e.sx, dy = e.y - e.sy, d = Math.hypot(dx, dy), lim = maxSpeed * dt * 1.02 + .01;
    if (d > lim) { e.x = e.sx + dx * lim / d; e.y = e.sy + dy * lim / d; flag('vitesse'); }
  }
  function checkFire(last, now, rate) { // cadence de tir : refuse un tir trop rapproché du précédent
    if (now - last < rate * .9) { flag('cadence de tir'); return false; }
    return true;
  }
  function checkDamage(amt, max) { // dégâts : bornés par le maximum de l'arme utilisée
    if (!Number.isFinite(amt) || amt < 0) { flag('dégâts invalides'); return 0; }
    if (amt > max + 1e-6) { flag('dégâts excessifs'); return max; }
    return amt;
  }
  function checkState(e) { // valeurs hors bornes (vie, bouclier, inventaire, munitions)
    if (e.hp > 100) { e.hp = 100; flag('vie'); }
    if (e.shield > 100) { e.shield = 100; flag('bouclier'); }
    if (e.medkits > 5) { e.medkits = 5; flag('soins'); }
    if (e.wood > 999) { e.wood = 999; flag('bois'); }
    for (const g of e.guns) if (g && g.ammo > WEAP[g.t].mag) { g.ammo = WEAP[g.t].mag; flag('munitions'); }
  }

  /* Fin de partie : le score est recalculé uniquement à partir du journal, puis la chaîne
     est rejouée ; si elle diffère, ou si une alerte a été levée, le score n'est pas vérifié. */
  function finalize() {
    let c = hash(nonce);
    const t = { kill: 0, dmg: 0, taken: 0, shot: 0, hit: 0, wood: 0, build: 0, heal: 0, rank: TOTAL, win: 0, time: 0 };
    for (const [k, v] of log) { c = hash(c + '|' + k + '|' + v); if (k === 'rank' || k === 'time') t[k] = v; else if (k in t) t[k] += v; }
    const score = t.kill * 100 + t.dmg + (t.win ? 500 : 0) + Math.max(0, TOTAL - t.rank) * 25;
    const verified = c === chain && flags.length === 0 && cfgSum === cfgHash() && t.kill <= TOTAL - 1;
    return { stats: t, score, verified, flags: flags.slice() };
  }
  /* Meilleur score : enregistré avec une somme de contrôle, relue et vérifiée au chargement. */
  const sign = (n, s) => hash('bosquet-royale|' + n + '|' + s);
  function saveBest(name, score) { try { localStorage.setItem('bosquet.best', JSON.stringify({ n: name, s: score, h: sign(name, score) })); } catch (e) {} }
  function loadBest() {
    try {
      const o = JSON.parse(localStorage.getItem('bosquet.best'));
      if (!o || typeof o.n !== 'string' || !Number.isInteger(o.s) || o.s < 0 || o.s > 50000) return null;
      const n = sanitizeName(o.n);
      if (n !== o.n || sign(n, o.s) !== o.h) return null; // enregistrement modifié à la main : ignoré
      return { name: n, score: o.s };
    } catch (e) { return null; }
  }
  return { sanitizeName, reset, record, flag, checkTeleport, checkMove, checkFire, checkDamage, checkState, finalize, saveBest, loadBest };
})();

/* ================================ 3. RÉGLAGES ================================ */
const ACTIONS = [
  ['up', 'Avancer', 'KeyW'], ['down', 'Reculer', 'KeyS'], ['left', 'Aller à gauche', 'KeyA'], ['right', 'Aller à droite', 'KeyD'],
  ['wall', 'Construire un mur', 'Digit1'], ['ramp', 'Construire une rampe', 'Digit2'], ['pick', 'Pioche', 'Digit3'],
  ['gun1', 'Arme 1', 'Digit4'], ['gun2', 'Arme 2', 'Digit5'], ['reload', 'Recharger', 'KeyR'], ['heal', 'Se soigner', 'KeyF'], ['use', 'Échanger une arme', 'KeyE']
];
const Settings = (() => {
  const AZERTY = { KeyW: 'Z', KeyA: 'Q', KeyQ: 'A', KeyZ: 'W', KeyM: ',', Semicolon: 'M' }; // libellés par défaut (clavier français)
  let layout = null;
  function label(code, key) {
    if (/^Digit\d$/.test(code)) return code.slice(5);
    if (/^Numpad\d$/.test(code)) return 'Num ' + code.slice(6);
    const named = { Space: 'Espace', ShiftLeft: 'Maj G', ShiftRight: 'Maj D', ControlLeft: 'Ctrl G', ControlRight: 'Ctrl D', AltLeft: 'Alt', Tab: 'Tab', ArrowUp: '↑', ArrowDown: '↓', ArrowLeft: '←', ArrowRight: '→', Enter: 'Entrée' };
    if (named[code]) return named[code];
    if (key && key.length === 1) return key.toUpperCase();
    if (layout && layout.get(code)) return layout.get(code).toUpperCase();
    if (AZERTY[code]) return AZERTY[code];
    return /^Key[A-Z]$/.test(code) ? code.slice(3) : code.slice(0, 8);
  }
  const data = { sens: 1, volume: .6, quality: 'medium', tutoDone: false, name: '', keys: {} };
  function defaults() { for (const [a, , code] of ACTIONS) data.keys[a] = { code, label: label(code), auto: true }; }
  defaults();
  /* Chargement : chaque champ est validé, rien de ce qui vient du stockage n'est cru sur parole. */
  function load() {
    try {
      const o = JSON.parse(localStorage.getItem('bosquet.settings'));
      if (!o || typeof o !== 'object') return;
      if (Number.isFinite(o.sens)) data.sens = clamp(o.sens, .2, 3);
      if (Number.isFinite(o.volume)) data.volume = clamp(o.volume, 0, 1);
      if (typeof o.quality === 'string' && Object.prototype.hasOwnProperty.call(QUALITY, o.quality)) data.quality = o.quality;
      data.tutoDone = o.tutoDone === true;
      if (typeof o.name === 'string' && o.name) data.name = Security.sanitizeName(o.name);
      if (o.keys && typeof o.keys === 'object') for (const [a] of ACTIONS) {
        const k = o.keys[a];
        if (k && typeof k.code === 'string' && /^[A-Za-z0-9]{1,24}$/.test(k.code)) data.keys[a] = { code: k.code, label: String(k.label || '').replace(/[<>&"']/g, '').slice(0, 8) || label(k.code), auto: k.auto === true };
      }
    } catch (e) {}
  }
  function save() { try { localStorage.setItem('bosquet.settings', JSON.stringify(data)); } catch (e) {} }
  function refreshAuto() { for (const [a] of ACTIONS) if (data.keys[a].auto) data.keys[a].label = label(data.keys[a].code); }
  load();
  // Si le navigateur sait décrire le clavier, on affiche les vraies lettres (AZERTY, QWERTY…).
  try { if (navigator.keyboard && navigator.keyboard.getLayoutMap) navigator.keyboard.getLayoutMap().then(m => { layout = m; refreshAuto(); UI.buildKeys(); }).catch(() => {}); } catch (e) {}
  function bind(action, code, key) {
    for (const [a] of ACTIONS) if (a !== action && data.keys[a].code === code) data.keys[a] = data.keys[action]; // échange si la touche est déjà prise
    data.keys[action] = { code, label: label(code, key), auto: false }; save();
  }
  function actionOf(code) { for (const [a] of ACTIONS) if (data.keys[a].code === code) return a; return null; }
  const key = a => data.keys[a].label;
  return { data, save, bind, actionOf, key, resetKeys() { defaults(); save(); } };
})();

/* ================================ 4. AUDIO ================================ */
const Audio = (() => {
  let ac = null, master = null;
  const listener = { x: 0, y: 0 };

    for (const h of houses) { m.fillStyle = OUT; m.fillRect(h.x * s - 1, h.y * s - 1, h.w * s + 2, h.h * s + 2); m.fillStyle = h.roof; m.fillRect(h.x * s, h.y * s, h.w * s, h.h * s); }
  }

  /* ---------- tutoriel du premier lancement ---------- */
  const k = Settings.key;
  const TUTO = [
    [() => 'Déplace-toi avec ' + k('up') + ' ' + k('left') + ' ' + k('down') + ' ' + k('right'), () => tuto.moved > 260],
    [() => 'Bouge la souris pour regarder autour de toi', () => tuto.turned > 1.6],
    [() => 'Frappe un arbre à la pioche (clic gauche) pour récolter du bois', () => tuto.hitTree],
    [() => 'Construis un mur avec ' + k('wall') + ' ou une rampe avec ' + k('ramp'), () => tuto.built],
    [() => 'Ramasse une arme en marchant dessus (objets lumineux, souvent dans les maisons)', () => tuto.gotGun],
    [() => 'Tire avec le clic gauche — ' + k('reload') + ' recharge, ' + k('heal') + ' soigne', () => tuto.fired]
  ];
  function updateTuto(dt) {
    if (!tuto.active) return;
    if (tuto.step < TUTO.length) { if (TUTO[tuto.step][1]()) { tuto.step++; sfx(null, null, 660, .15, 'triangle', .2, 990); if (tuto.step === TUTO.length) { tuto.doneT = 4; Settings.data.tutoDone = true; Settings.save(); } } }
    else { tuto.doneT -= dt; if (tuto.doneT <= 0) tuto.active = false; }
  }

  /* ---------- HUD ---------- */
  function drawHUD(t) {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, vw, vh);
    if (state === 'menu') return;
    const p = player, s = storm;
    // retours plein écran : dégâts (rouge), soin (vert), tempête (violet)
    const vign = (c, a) => { if (a <= .01) return; const g = ctx.createRadialGradient(vw / 2, vh / 2, Math.min(vw, vh) * .35, vw / 2, vh / 2, Math.max(vw, vh) * .7); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, c + a + ')'); ctx.fillStyle = g; ctx.fillRect(0, 0, vw, vh); };
    vign('rgba(255,40,70,', Math.min(.6, fx.hurt * .6)); vign('rgba(80,255,120,', fx.heal * .4);
    const inStorm = p.alive && Math.hypot(p.x - s.x, p.y - s.y) > s.r;
    if (inStorm) vign('rgba(150,60,235,', .35 + .1 * Math.sin(t * 6));
    // textes flottants (dégâts, ramassages) projetés depuis la scène 3D
    for (const f of texts) { const q = Render.project(f.x, f.y, f.h); if (!q.vis) continue; ctx.globalAlpha = clamp(f.life * 2, 0, 1); txt(f.txt, q.x, q.y, 18, f.col, 'center'); }
    ctx.globalAlpha = 1;
    // mini-carte
    const M = 170, mx = vw - M - 16, my = 16, km = M / W;
    ctx.save(); rr(mx, my, M, M, 14); ctx.clip();
    ctx.drawImage(mmCanvas, mx, my, M, M);
    ctx.fillStyle = 'rgba(150,60,235,.5)'; ctx.beginPath(); ctx.rect(mx, my, M, M); ctx.arc(mx + s.x * km, my + s.y * km, Math.max(0, s.r * km), 0, TAU, true); ctx.fill('evenodd');
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(mx + s.nx * km, my + s.ny * km, Math.max(.5, s.nr * km), 0, TAU); ctx.stroke();
    ctx.fillStyle = '#e9b872'; for (const st of structures) ctx.fillRect(mx + st.x * km - 1, my + st.y * km - 1, 2, 2);
    if (p.alive) { ctx.translate(mx + p.x * km, my + p.y * km); ctx.rotate(p.ang); ctx.fillStyle = '#ffd21f'; ctx.strokeStyle = OUT; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(-5, -5.5); ctx.lineTo(-2, 0); ctx.lineTo(-5, 5.5); ctx.closePath(); ctx.fill(); ctx.stroke(); }
    ctx.restore();
    ctx.strokeStyle = OUT; ctx.lineWidth = 4; rr(mx, my, M, M, 14); ctx.stroke();
    // joueurs restants, éliminations, minuteur de tempête
    panel(mx, my + M + 8, M, 58);
    txt(aliveCount + ' en vie', mx + 12, my + M + 25, 17, '#fff', 'left'); txt(p.kills + ' élim.', mx + M - 12, my + M + 25, 15, '#ffe14d', 'right');
    const left = s.t < WAIT ? Math.ceil(WAIT - s.t) : Math.ceil(CYCLE - s.t), closing = s.t >= WAIT && s.fr > s.nr;
    txt(s.r <= 0 ? '⚡ Tempête totale' : closing ? '⚡ Rétrécit… ' + left + ' s' : '⚡ Tempête dans ' + left + ' s', mx + 12, my + M + 49, 14, closing || s.r <= 0 ? '#e3b5ff' : '#fff', 'left');
    // fil des éliminations
    for (let i = 0; i < feed.length; i++) { const f = feed[i]; ctx.globalAlpha = clamp(f.t, 0, 1); ctx.font = 'bold 14px "Trebuchet MS",Verdana,sans-serif'; const w = ctx.measureText(f.txt).width; panel(14, 14 + i * 30, w + 20, 25, 'rgba(30,28,55,.55)'); txt(f.txt, 24, 27 + i * 30, 14, f.col, 'left', true); }
    ctx.globalAlpha = 1;
    if (tuto.active) { // bandeau du tutoriel
      const done = tuto.step >= TUTO.length, msg = done ? 'Tutoriel terminé — bonne chance !' : 'Tutoriel ' + (tuto.step + 1) + '/' + TUTO.length + ' — ' + TUTO[tuto.step][0]();
      ctx.font = 'bold 17px "Trebuchet MS",Verdana,sans-serif'; const w = Math.min(vw - 40, ctx.measureText(msg).width + 36);
      panel((vw - w) / 2, 70, w, 38, done ? 'rgba(40,150,70,.85)' : 'rgba(255,210,31,.92)'); txt(msg, vw / 2, 90, 17, done ? '#fff' : OUT, 'center', true);
    }
    if (inStorm) txt('⚡ Tu es dans la tempête !', vw / 2, 140, 24, '#e3b5ff', 'center');
    if (!p.alive) return;
    // vie et bouclier
    const bx = 18, by = vh - 62;
    bar(bx, by, 250, 16, p.shield / 100, '#4dc3ff'); txt(Math.round(p.shield) + '', bx + 260, by + 9, 14, '#bfe9ff', 'left');
    bar(bx, by + 22, 250, 24, p.hp / 100, p.hp > 50 ? '#5fe36a' : p.hp > 25 ? '#ffb02e' : '#ff5470'); txt(Math.ceil(p.hp) + '', bx + 260, by + 35, 20, '#fff', 'left');
    // arme en main et munitions
    const g = Game.curGun(p);
    if (g) { const w = WEAP[g.t]; txt(g.ammo + '', vw - 86, vh - 46, 44, g.ammo === 0 ? '#ff8a8a' : '#fff', 'right'); txt('/ ' + w.mag, vw - 78, vh - 38, 20, '#cfd3e6', 'left'); txt(w.name, vw - 20, vh - 84, 16, w.col, 'right'); if (p.reload > 0) { bar(vw - 200, vh - 20, 180, 10, 1 - p.reload / w.reload, '#ffe14d'); } }
    else { txt('Pioche', vw - 20, vh - 46, 28, '#fff', 'right'); }
    // emplacements, bois, soins
    const SW = 54, gap = 6, labels = [[k('pick'), '⛏', p.slot === 0, true], [k('gun1'), p.guns[0] ? WEAP[p.guns[0].t].name.slice(0, 5) : '—', p.slot === 1, !!p.guns[0]], [k('gun2'), p.guns[1] ? WEAP[p.guns[1].t].name.slice(0, 5) : '—', p.slot === 2, !!p.guns[1]]];
    const tot = 3 * SW + 2 * gap + 200, sx = (vw - tot) / 2, sy = vh - 58;
    labels.forEach((l, i) => { const x = sx + i * (SW + gap); ctx.globalAlpha = l[3] ? 1 : .5; panel(x, sy, SW, 44, l[2] ? 'rgba(255,210,31,.92)' : null); const gu = i > 0 && p.guns[i - 1]; if (gu) { ctx.fillStyle = WEAP[gu.t].col; rr(x + 8, sy + 36, SW - 16, 4, 2); ctx.fill(); } txt(l[0], x + 6, sy + 10, 11, l[2] ? OUT : '#cfd3e6', 'left', true); txt(l[1], x + SW / 2, sy + 25, i ? 12 : 18, l[2] ? OUT : '#fff', 'center', true); ctx.globalAlpha = 1; });
    const ix = sx + 3 * (SW + gap) + 6;
    panel(ix, sy, 194, 44);
    txt('🪵 ' + p.wood, ix + 12, sy + 14, 15, '#ffcf8a', 'left', true); txt('✚ ' + p.medkits + '  [' + k('heal') + ']', ix + 12, sy + 32, 13, p.medkits ? '#8dffa0' : '#8a8fa8', 'left', true);
    txt('[' + k('wall') + '] Mur', ix + 108, sy + 14, 13, p.wood >= 10 ? '#fff' : '#8a8fa8', 'left', true); txt('[' + k('ramp') + '] Rampe', ix + 108, sy + 32, 13, p.wood >= 10 ? '#fff' : '#8a8fa8', 'left', true);
    // messages contextuels
    const ng = (p.guns[0] && p.guns[1]) ? Game.nearGun() : null;
    if (ng) txt('[' + k('use') + '] Échanger contre ' + WEAP[ng.t].name, vw / 2, sy - 26, 17, WEAP[ng.t].col, 'center');
    if (p.high) txt('EN HAUTEUR', vw / 2, sy - 52, 14, '#ffe14d', 'center');
    if (!locked) txt('Clique pour capturer la souris', vw / 2, vh / 2 + 70, 15, '#fff', 'center');
    // viseur (là où pointe réellement le tir), marqueur de touche, progression du soin
    const q = Render.project(p.x + Math.cos(p.ang) * 520, p.y + Math.sin(p.ang) * 520, p.elev + 1.45), cx = q.x, cy = clamp(q.y, 40, vh - 120), sp = 5 + fx.recoil * 9;
    ctx.lineCap = 'round';
    for (const [c, w] of [[OUT, 5], ['#fff', 2.5]]) { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(cx - sp - 9, cy); ctx.lineTo(cx - sp, cy); ctx.moveTo(cx + sp, cy); ctx.lineTo(cx + sp + 9, cy); ctx.moveTo(cx, cy - sp - 9); ctx.lineTo(cx, cy - sp); ctx.moveTo(cx, cy + sp); ctx.lineTo(cx, cy + sp + 9); ctx.stroke(); }
    if (fx.hitMarker > 0) { ctx.strokeStyle = '#ff5470'; ctx.lineWidth = 3.5; ctx.beginPath(); for (const [a, b] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) { ctx.moveTo(cx + a * 8, cy + b * 8); ctx.lineTo(cx + a * 17, cy + b * 17); } ctx.stroke(); }
    if (p.healT > 0) { ctx.strokeStyle = OUT; ctx.lineWidth = 9; ctx.beginPath(); ctx.arc(cx, cy, 30, 0, TAU); ctx.stroke(); ctx.strokeStyle = '#8dffa0'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(cx, cy, 30, -Math.PI / 2, -Math.PI / 2 + TAU * (1 - p.healT / 1.6)); ctx.stroke(); txt('Soin…', cx, cy + 48, 14, '#8dffa0', 'center'); }
  }

  /* ---------- menus ---------- */
  function refreshBest() { const b = Security.loadBest(); $('best').textContent = b ? 'Record : ' + b.score + ' points (' + b.name + ')' : ''; }
  function buildKeys() { // liste des touches, construite sans innerHTML
    const box = $('keys'); if (!box) return;
    while (box.firstChild) box.removeChild(box.firstChild);
    for (const [a, name] of ACTIONS) {
      const row = document.createElement('div'); row.className = 'row';
      const sp = document.createElement('span'); sp.textContent = name;
      const b = document.createElement('button'); b.className = 'keybtn' + (rebinding === a ? ' wait' : ''); b.textContent = rebinding === a ? 'Appuie…' : Settings.data.keys[a].label;
      b.addEventListener('click', () => { rebinding = rebinding === a ? null : a; buildKeys(); });
      row.appendChild(sp); row.appendChild(b); box.appendChild(row);
    }
  }
  function openSettings(from) {
    settingsFrom = from; rebinding = null;
    $('optSens').value = Settings.data.sens; $('optVol').value = Settings.data.volume; $('optQual').value = Settings.data.quality; $('optTuto').checked = !Settings.data.tutoDone;
    buildKeys(); show(from, false); show('settings', true);
  }
  function closeSettings() { rebinding = null; Settings.save(); show('settings', false); show(settingsFrom, true); }
  function lock() { try { const r = glc.requestPointerLock(); if (r && r.catch) r.catch(() => {}); } catch (e) {} }
  function unlock() { try { if (document.pointerLockElement) document.exitPointerLock(); } catch (e) {} }
  function startGame() {
    Audio.unlock();
    const name = Security.sanitizeName($('pseudo').value); // pseudo nettoyé avant tout usage
    $('pseudo').value = name; Settings.data.name = name; Settings.save();
    clearTimeout(endTimer);
    Game.init(name); buildMinimap(); Render.buildWorld();
    Object.assign(tuto, { active: !Settings.data.tutoDone, step: 0, moved: 0, turned: 0, hitTree: false, built: false, gotGun: false, fired: false, doneT: 0 });
    for (const a in held) held[a] = false; api.mouseDown = false;
    fx.hurt = fx.heal = fx.recoil = fx.shake = 0;
    state = 'play';
    show('menu', false); show('end', false); show('pause', false); show('settings', false);
    lock();
  }
  function pause() { if (state !== 'play') return; state = 'pause'; api.mouseDown = false; for (const a in held) held[a] = false; show('pause', true); unlock(); }
  function resume() { if (state !== 'pause') return; state = 'play'; show('pause', false); lock(); }
  function toMenu() { clearTimeout(endTimer); state = 'menu'; show('pause', false); show('end', false); show('menu', true); refreshBest(); unlock(); }
  /* Écran de fin : statistiques tirées du journal vérifié par le module Sécurité. */
  function endGame(won) {
    if (state !== 'play') return;
    state = won ? 'won' : 'dead'; api.mouseDown = false;
    Security.record('rank', won ? 1 : aliveCount + 1); Security.record('time', gameTime); if (won) Security.record('win', 1);
    const r = Security.finalize(), t = r.stats, best = Security.loadBest();
    const isBest = r.verified && (!best || r.score > best.score);
    if (isBest) Security.saveBest(player.name, r.score);
    const T = $('endTitle'); T.textContent = won ? 'VICTOIRE !' : 'ÉLIMINÉ !'; T.className = won ? 'win' : 'lose';
    $('endText').textContent = won ? 'Bravo ' + player.name + ', tu es le dernier survivant !' : player.name + ', tu termines n°' + t.rank + ' sur ' + TOTAL + (player.killer ? ' — éliminé par ' + player.killer.name : ' — emporté par la tempête') + '.';
    const box = $('stats'); while (box.firstChild) box.removeChild(box.firstChild);
    const acc = t.shot ? Math.min(100, Math.round(t.hit / t.shot * 100)) + ' %' : '—';
    const rows = [['Score', r.score + (isBest ? ' ★' : '')], ['Classement', t.rank + ' / ' + TOTAL], ['Éliminations', t.kill], ['Dégâts infligés', t.dmg], ['Dégâts subis', t.taken], ['Précision', acc], ['Bois récolté', t.wood], ['Constructions', t.build], ['Soins utilisés', t.heal], ['Temps de survie', Math.floor(t.time / 60) + ' min ' + (t.time % 60) + ' s']];
    for (const [l, v] of rows) { const d = document.createElement('div'); d.className = 'stat'; const b = document.createElement('b'); b.textContent = String(v); const sp = document.createElement('span'); sp.textContent = l; d.appendChild(b); d.appendChild(sp); box.appendChild(d); }
    const I = $('integrity');
    I.textContent = r.verified ? '✔ Score vérifié' + (isBest ? ' — nouveau record !' : best ? ' — record : ' + best.score : '') : '⚠ Score non vérifié (anomalie : ' + (r.flags[0] || 'journal altéré') + ') — il n\'est pas enregistré.';
    I.className = 'note ' + (r.verified ? 'ok' : 'bad');
    if (won) sfx(null, null, 520, .6, 'triangle', .3, 1040);
    endTimer = setTimeout(() => { show('end', true); unlock(); }, won ? 900 : 1300);
  }

  /* ---------- entrées ---------- */
  function onAction(a) {
    const p = player;
    switch (a) {
      case 'wall': if (!Game.buildWall(p, p.ang) && p.wood < 10) { Game.floatText(p.x, p.y, 'Pas assez de bois', '#ff8a8a', p.elev + 3.4); sfx(null, null, 140, .12, 'square', .12, 100); } break;
      case 'ramp': if (!Game.buildRamp(p, p.ang) && p.wood < 10) { Game.floatText(p.x, p.y, 'Pas assez de bois', '#ff8a8a', p.elev + 3.4); sfx(null, null, 140, .12, 'square', .12, 100); } break;
      case 'pick': Game.setSlot(p, 0); break;
      case 'gun1': Game.setSlot(p, 1); break;
      case 'gun2': Game.setSlot(p, 2); break;
      case 'reload': Game.startReload(p); break;
      case 'heal': Game.useHeal(p); break;
      case 'use': { const g = Game.nearGun(); if (g) Game.takeGun(p, g); break; }
    }
  }
  function bindEvents() {
    window.addEventListener('resize', resize);
    window.addEventListener('keydown', e => {
      if (rebinding) { // capture d'une nouvelle touche
        e.preventDefault();
        if (e.code !== 'Escape' && /^[A-Za-z0-9]{1,24}$/.test(e.code)) Settings.bind(rebinding, e.code, e.key);
        rebinding = null; buildKeys(); return;
      }
      if (e.target === $('pseudo')) { if (e.code === 'Enter') startGame(); return; }
      if (e.code === 'Escape') { if (state === 'play') pause(); else if (state === 'pause' && $('settings').classList.contains('hidden')) resume(); return; }
      if (state !== 'play') return;
      if (['Tab', 'Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
      const a = Settings.actionOf(e.code);
      if (!a || e.repeat) return;
      held[a] = true;
      if (player.alive) onAction(a);
    });
    window.addEventListener('keyup', e => { const a = Settings.actionOf(e.code); if (a) held[a] = false; });
    window.addEventListener('blur', () => { for (const a in held) held[a] = false; api.mouseDown = false; });
    document.addEventListener('pointerlockchange', () => { locked = document.pointerLockElement === glc; if (!locked && wasLocked && state === 'play') pause(); wasLocked = locked; });
    document.addEventListener('mousemove', e => { // la souris fait pivoter le personnage et la caméra
      if (state !== 'play' || !player.alive) return;
      const dx = clamp(e.movementX || 0, -250, 250), dy = clamp(e.movementY || 0, -250, 250), s = .0024 * Settings.data.sens;
      player.ang += dx * s; tuto.turned += Math.abs(dx * s); Render.look(dx, dy * s * .6);
    });
    glc.addEventListener('mousedown', e => { if (state !== 'play') return; if (!locked) lock(); if (e.button === 0) api.mouseDown = true; });
    window.addEventListener('mouseup', e => { if (e.button === 0) api.mouseDown = false; });
    glc.addEventListener('contextmenu', e => e.preventDefault());
    window.addEventListener('wheel', e => {
      if (state !== 'play' || !player.alive) return;
      const dir = e.deltaY > 0 ? 1 : -1; let s = player.slot;
      for (let i = 0; i < 3; i++) { s = (s + dir + 3) % 3; if (s === 0 || player.guns[s - 1]) break; }
      Game.setSlot(player, s);
    }, { passive: true });
    $('btnPlay').addEventListener('click', startGame);
    $('btnReplay').addEventListener('click', startGame);
    $('btnMenu').addEventListener('click', toMenu);
    $('btnQuit').addEventListener('click', toMenu);
    $('btnResume').addEventListener('click', resume);
    $('btnSettings').addEventListener('click', () => openSettings('menu'));
    $('btnPauseSettings').addEventListener('click', () => openSettings('pause'));
    $('btnCloseSettings').addEventListener('click', closeSettings);
    $('btnResetKeys').addEventListener('click', () => { Settings.resetKeys(); rebinding = null; buildKeys(); });
    $('optSens').addEventListener('input', e => { Settings.data.sens = clamp(parseFloat(e.target.value) || 1, .2, 3); });
    $('optVol').addEventListener('input', e => { Settings.data.volume = clamp(parseFloat(e.target.value) || 0, 0, 1); Audio.unlock(); Audio.setVolume(Settings.data.volume); sfx(null, null, 520, .08, 'triangle', .25, 780); });
    $('optQual').addEventListener('change', e => { if (Object.prototype.hasOwnProperty.call(QUALITY, e.target.value)) { Settings.data.quality = e.target.value; Render.applyQuality(); Render.resize(); } });
    $('optTuto').addEventListener('change', e => { Settings.data.tutoDone = !e.target.checked; });
    $('pseudo').addEventListener('input', e => { const v = e.target.value, c = v.replace(/[^\p{L}\p{N} _-]/gu, '').slice(0, 16); if (c !== v) e.target.value = c; }); // filtrage en direct
  }
  function resize() { dpr = Math.min(2, window.devicePixelRatio || 1); vw = window.innerWidth; vh = window.innerHeight; hud.width = Math.round(vw * dpr); hud.height = Math.round(vh * dpr); Render.resize(); }
  function init() { $('pseudo').value = Settings.data.name; bindEvents(); refreshBest(); buildKeys(); resize(); }
  return Object.assign(api, { init, drawHUD, updateTuto, endGame, buildKeys, buildMinimap });
})();

/* ================================ 10. BOUCLE ================================ */
Render.init();
Game.init('Joueur'); UI.buildMinimap(); Render.buildWorld(); // île de démonstration derrière le menu
UI.init();
let last = 0;
function loop(ts) {
  const dt = Math.min(.05, (ts - last) / 1000 || 0); last = ts;
  if (state === 'play' || state === 'dead') { Game.update(dt); UI.updateTuto(dt); }
  if (state !== 'pause') Game.updateFx(dt);
  Render.frame(dt, ts / 1000);
  UI.drawHUD(ts / 1000);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
})(); // fin du programme
</script>
